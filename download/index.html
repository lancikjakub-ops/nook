<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nook Download</title>
</head>
<body>
<pre>{
  "status": "operation success",
  "message": "thanks for downloading nook"
}</pre>

<script>
    window.onload = () => {
        const msi = document.createElement("a");
        msi.href = "./NookInstaller.msi";
        msi.download = "NookInstaller.msi";
        document.body.appendChild(msi);
        msi.click();
        msi.remove();
    };
</script>
</body>
</html>
